<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;background:var(--bg0);color:var(--tx1);transition:background .2s,color .2s}
:root{
  --bg0:#111827;--bg1:#1f2937;--bg2:#374151;--br:#374151;--br2:#4b5563;
  --tx1:#f9fafb;--tx2:#9ca3af;--tx3:#6b7280;
  --gold:#f59e0b;--goldbg:rgba(245,158,11,.1);--goldtx:#fcd34d;
  --green:#10b981;--greenbg:rgba(16,185,129,.14);
  --red:#ef4444;--redbg:rgba(239,68,68,.14);
  --orange:#f97316;--orangebg:rgba(249,115,22,.16);
  --blue:#3b82f6;--bluebg:rgba(59,130,246,.14);
  --violet:#a78bfa;--violetbg:rgba(167,139,250,.16);
  --cyan:#22d3ee;--cyanbg:rgba(34,211,238,.14);
  --yellow:#eab308;--yellowbg:rgba(234,179,8,.16);
  /* chart marks: stepped for the dark surface, validated in-band vs --bg1 */
  --c-bar:#d97706;--c-line:#3b82f6;--c-pos:#059669;--c-neg:#ef4444;--c-surface:#1f2937;
}
:root.light{
  --bg0:#f3f4f6;--bg1:#ffffff;--bg2:#e5e7eb;--br:#e5e7eb;--br2:#d1d5db;
  --tx1:#111827;--tx2:#4b5563;--tx3:#9ca3af;
  --gold:#d97706;--goldbg:rgba(217,119,6,.12);--goldtx:#92400e;
  --green:#059669;--greenbg:rgba(5,150,105,.12);
  --red:#dc2626;--redbg:rgba(220,38,38,.1);
  --orange:#ea580c;--orangebg:rgba(234,88,12,.14);
  --blue:#2563eb;--bluebg:rgba(37,99,235,.12);
  --violet:#7c3aed;--violetbg:rgba(124,58,237,.13);
  --cyan:#0891b2;--cyanbg:rgba(8,145,178,.12);
  --yellow:#ca8a04;--yellowbg:rgba(202,138,4,.16);
  --c-bar:#d97706;--c-line:#2563eb;--c-pos:#059669;--c-neg:#dc2626;--c-surface:#ffffff;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--bg2);border:1px solid var(--br2);border-radius:7px;padding:7px 11px;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#111827;font-weight:600}
.btn.dgr{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12px}
.fld{background:var(--bg0);border:1px solid var(--br2);border-radius:7px;padding:7px 9px;width:100%}
.fld:focus{outline:none;border-color:var(--gold)}
/* topbar */
.topbar{display:flex;align-items:center;gap:6px;padding:0 10px;height:50px;border-bottom:1px solid var(--br);background:var(--bg1);flex-shrink:0}
.logo{font-family:monospace;font-weight:700;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;letter-spacing:.3px}
.topbar select{background:var(--bg2);border:1px solid var(--br2);border-radius:7px;padding:5px 7px;font-size:13px;font-family:monospace}
.topbar button{background:var(--bg2);border:1px solid var(--br2);border-radius:7px;padding:5px 8px;font-size:15px}
@media(max-width:640px){.topbar{gap:4px;padding:0 6px}.topbar .logo{font-size:11px}}
/* tabs */
.tabs{display:flex;background:var(--bg1);border-bottom:1px solid var(--br);flex-shrink:0}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:9px 4px;font-size:12.5px;color:var(--tx2);font-weight:600}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
/* view */
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 40px}
.wrap{max-width:900px;margin:0 auto}
/* a escriptori la graella no ha de créixer sense fre: les cel·les són quadrades */
.calwrap{max-width:520px;margin:0 auto}
.card{background:var(--bg1);border:1px solid var(--br);border-radius:11px;padding:12px;margin-bottom:10px}
.card-t{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:9px}
/* month nav */
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mnav button{background:var(--bg1);border:1px solid var(--br2);border-radius:8px;padding:6px 12px;font-size:15px}
.mnav .mtitle{flex:1;text-align:center;font-weight:700;font-size:15px;letter-spacing:.4px}
/* calendar grid */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.wk div{text-align:center;font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{aspect-ratio:1;border:1px solid var(--br);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--bg1);overflow:hidden;padding:1px}
.day.pad{border-color:transparent;background:none}
.day.act{cursor:pointer}
.day.act:hover{border-color:var(--gold)}
.day .n{font-size:14px;font-weight:600;line-height:1.1}
.day .h{font-size:9.5px;font-family:monospace;color:var(--tx2);line-height:1.2}
.day .tag{position:absolute;top:2px;right:3px;font-size:8px;font-weight:800;font-family:monospace;letter-spacing:.3px;opacity:.85}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
/* calendar-type tints (when no user state) */
.t-X{background:var(--bg0);color:var(--tx3)}
.t-F{background:var(--yellowbg);color:var(--yellow)}
.t-B{background:var(--bluebg);color:var(--blue)}
/* user-state tints */
.s-HQ{background:var(--bg2)}
.s-EST{background:var(--orangebg);color:var(--orange)}
.s-NAC{background:var(--violetbg);color:var(--violet)}
.s-POS{background:none;border-style:dashed;border-color:var(--orange);color:var(--orange)}
.s-VAC{background:var(--greenbg);color:var(--green)}
.s-LD{background:var(--cyanbg);color:var(--cyan)}
.day .h{color:inherit;opacity:.8}
/* legend */
.leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:10px;font-size:11px;color:var(--tx2)}
.leg span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid var(--br2);flex-shrink:0}
/* chips row */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg0);border:1px solid var(--br);border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--tx2);font-family:monospace;white-space:nowrap}
.chip b{color:var(--tx1);font-weight:700}
.chip.pos b{color:var(--green)}.chip.neg b{color:var(--red)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--bg1);border:1px solid var(--br);border-radius:11px;padding:11px 13px}
.kpi .k{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.kpi .v{font-size:22px;font-weight:700;font-family:monospace;line-height:1.35;letter-spacing:-.5px;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--tx2)}
.kpi.hero .v{font-size:27px}
.kpi .v.pos{color:var(--green)}.kpi .v.neg{color:var(--red)}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:0 6px 6px;border-bottom:1px solid var(--br)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--br);font-family:monospace}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;border-top:1px solid var(--br2);border-bottom:none;padding-top:7px}
td.pos{color:var(--green)}td.neg{color:var(--red)}
td.dim{color:var(--tx3)}
/* chart */
.chartwrap{position:relative;overflow-x:auto}
/* al mòbil el gràfic no s'encongeix fins a fer-se il·legible: fa scroll dins la targeta */
.chartwrap svg{display:block;min-width:560px;width:100%;height:auto}
.clegend{display:flex;gap:14px;font-size:11px;color:var(--tx2);margin-bottom:8px;flex-wrap:wrap}
.clegend span{display:flex;align-items:center;gap:5px}
#tip{position:fixed;z-index:80;background:var(--bg2);border:1px solid var(--br2);border-radius:7px;padding:5px 9px;font-size:11.5px;font-family:monospace;pointer-events:none;display:none;white-space:pre;box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* sheet + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.scrim.on{display:block}
/* Tancat, el full ha de ser transparent als clics I invisible al tabulador.
   A l'escriptori es tanca amb opacity:0 però es queda centrat damunt del
   calendari: sense això s'empassa els clics de les cel·les i sembla que el
   calendari s'hagi penjat. Al mòbil no es notava perquè marxa avall. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg1);border-top:1px solid var(--br2);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);pointer-events:none;transition:transform .22s}
.sheet.on{transform:translateY(0);pointer-events:auto}
@media(min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-42%) scale(.97);opacity:0;width:560px;border-radius:14px;border:1px solid var(--br2);max-height:86vh;transition:opacity .18s,transform .18s}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sh-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sh-t{font-weight:700;font-size:15px;flex:1}
.sh-sub{font-size:11.5px;color:var(--tx2);margin-bottom:12px;font-family:monospace}
.lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin:11px 0 5px}
.stbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.stb{border:1px solid var(--br2);background:var(--bg0);border-radius:8px;padding:8px 6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.stb small{font-size:9.5px;font-weight:500;color:var(--tx3);font-family:monospace}
.stb.on{border-width:2px;padding:7px 5px}
.hrow{display:flex;gap:6px;align-items:center}
.hrow .fld{text-align:center;font-family:monospace;font-size:17px;font-weight:700}
/* hora : minut, amb els dos desplegables junts */
.hm{display:flex;align-items:center;gap:4px}
.hm .fld{text-align:center;font-family:monospace;padding:7px 2px}
.hm span{color:var(--tx3);font-weight:700}
.hrow button{background:var(--bg2);border:1px solid var(--br2);border-radius:8px;width:42px;height:40px;font-size:17px;flex-shrink:0}
.acts{display:flex;gap:7px;margin-top:16px}
.acts .btn{flex:1;padding:10px}
.note{font-size:11px;color:var(--tx3);margin-top:6px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hide{display:none!important}
</style>
</head>

<script>
"use strict";
/* ───────────────────────── Calendari oficial ─────────────────────────
   Una lletra per dia natural, de l'1 de gener al 31 de desembre.
   P jornada partida 8,25 · V divendres 6,00 · I intensiva estiu 7,00
   C jornada curta 6,50 · F festiu · B pont (vacances) · X no laborable
   El 2026 està transcrit del calendari laboral signat (1.890,00 h). */
const CAL = {
  2026:
    "FBXXBFPPVXXPPPPVXXPPPPVXXPPPPVX" + // gener
    "XPPPPVXXPPPPVXXPPPPVXXPPPPVX"    + // febrer
    "XPPPPVXXPPPPVXXPPPPVXXPPPPVXXPP" + // març
    "PBFXXFPPPVXXPPPPVXXPPPPVXXPPPP"  + // abril
    "FXXPPPPVXXFPPPVXXPPPPVXXPPPPVXX" + // maig
    "PPPPVXXPPPPVXXPPPPVXXPPFPVXXPP"  + // juny
    "PPVXXPPPPVXXIIIIIXXIIIIIXXIIIII" + // juliol
    "XXIIIIIXXIIIIIFXIIIIIXXIIIIIXXP" + // agost
    "PPPVXXPPPVFXXPPPPVXXPPPPVXXPPP"  + // setembre
    "PVXXPPPPVXXFPPPVXXPPPPVXXPPPPVX" + // octubre
    "FPPPPVXXPPPPVXXPPPPVXXPPPPVXXP"  + // novembre
    "PPPVXFFFPPVXXPPPPVXXPPPCFFXPPPC"   // desembre
};

const TYPES = {
  P:{h:8.25,l:"Jornada partida"}, V:{h:6.00,l:"Divendres"},
  I:{h:7.00,l:"Intensiva d'estiu"}, C:{h:6.50,l:"Jornada curta"},
  F:{h:0,l:"Festiu"}, B:{h:0,l:"Pont (vacances)"}, X:{h:0,l:"No laborable"}
};
const STATES = {
  HQ :{l:"HQ",        s:"A la seu",         c:"--tx2",    v:"-"},
  EST:{l:"Estranger", s:"Viatge fora",      c:"--orange", v:"I"},
  NAC:{l:"Nacional",  s:"Viatge estatal",   c:"--violet", v:"N"},
  POS:{l:"Possible",  s:"Viatge previst",   c:"--orange", v:"-"},
  VAC:{l:"Vacances",  s:"Consumeix bossa",  c:"--green",  v:"-"},
  LD :{l:"Lliure d.", s:"Lliure disposició",c:"--cyan",   v:"-"},
  DC :{l:"Descans c.",s:"Gasta bossa h.",   c:"--gold",   v:"-"}
};
const MONTHS = ["Gener","Febrer","Març","Abril","Maig","Juny","Juliol","Agost","Setembre","Octubre","Novembre","Desembre"];
const MSHORT = ["GEN","FEB","MAR","ABR","MAI","JUN","JUL","AGO","SET","OCT","NOV","DES"];
const WDAYS  = ["dl","dt","dc","dj","dv","ds","dg"];

/* ───────────────────────── Dades ───────────────────────── */
const KEY = "cal_v1_data", KTHM = "cal_v1_thm", KTOK = "cal_v1_tok", KROOT = "cal_v1_root";
const DEFCFG = () => ({vacH:144, ldH:12, carry:0, target:null});
/* Paràmetres de nòmina — valors inicials presos del full ⚙️ Config del
   simulador 2026. Tot el motor llegeix d'aquí: canviant un número es recalcula. */
const DEFPAY = () => ({
  salari:47000, pagues:14, horesAny:1746,
  esmorzar:8, dinar:20, sopar:25, pernocta:30, capSetmana:50, kmEur:0.36,
  intlLab:70, intlFest:100,
  incrExtra:0.10, factCdS:1.5, factLab:1, hJornadaDescans:9, mesosCaducitat:2,
  ssCC:0.047, ssAtur:0.0155, ssFP:0.001, ssMEI:0.0015,
  ssExtra:0.047, forcaMajor:false, ssExtraFM:0.02, topall:5101.20,
  solT1:0.0115, solT2:0.0125, solT3:0.0146, solLim1:0.10, solLim2:0.50, solTreb:0.1661,
  mesosExtra:[5,11],           /* juny i desembre — amb 14 pagues, 12 + 2 extres */
  irpfMode:"AUTO", irpfPct:0.1515, irpfAjust:0, irpfMin:0,
  /* dades personals per a l'algoritme de retencions de l'AEAT */
  situacio:3, edat:45, discap:0, ajudaTercers:false, descend:0, descend3:0, descend50:true,
  ascend:0, ascend75:0, pensioConjuge:0, aliments:0, mobilitat:false,
  contracteIni:"2026-08-24", contracteFi:"", diesMesProrrata:30,
  art7p:true, art7pSalari:true, art7pExtres:true, art7pDietes:true, art7pLimit:60100
});
let DB = {v:1, years:{}};
let YEAR = 2026, MONTH = new Date().getMonth(), VIEW = "cal", SEL = null;

/* Google Drive — mateix client OAuth que el Field Service Log, així que només
   funciona servit des d'un origen autoritzat (https://txals13.github.io/...).
   Obrint el fitxer del disc l'autenticació no arrenca. */
const CLIENT_ID = "514772123815-ncjsebgvc01t8arftqp8bo43jr4fgneb.apps.googleusercontent.com";
const ROOT_NAME = "Calendari laboral", DATA_FILE = "calendari_laboral_data.json";
const TOMB_DAYS = 90; /* les làpides caduquen: prou temps perquè tot dispositiu hagi sincronitzat */
let token = null, tokenExp = 0, fileId = null, rootId = null;
let signedIn = false, syncing = false, pushPending = false, pushTimer = null, lastSync = 0, syncErr = "";
/* el testimoni d'OAuth dura una hora i no hi ha refresc: needsAuth distingeix
   «has tancat la sessió» de «només cal tornar a autoritzar», que és un toc */
let needsAuth = false;

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) DB = JSON.parse(r); }catch(e){}
  if(!DB.years) DB = {v:1, years:{}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ alert("No s'han pogut desar les dades: "+e.message); }
  schedulePush();
}
function yr(y){
  y = String(y);
  if(!DB.years[y]) DB.years[y] = {days:{}, cfg:DEFCFG()};
  const o = DB.years[y];
  if(!o.days) o.days = {};
  /* Completem les claus que faltin SENSE substituir l'objecte: hi ha codi que
     en guarda la referència, i abans es quedava apuntant a una còpia òrfena. */
  const fill = (dst, def) => { for(const k in def) if(!(k in dst)) dst[k] = def[k]; return dst; };
  if(!o.cfg) o.cfg = {}; fill(o.cfg, DEFCFG());
  if(!o.pay) o.pay = {}; fill(o.pay, DEFPAY());
  return o;
}

/* ───────────────────────── Dates i tipus ───────────────────────── */
const pad = n => String(n).padStart(2,"0");
const iso = (y,m,d) => y+"-"+pad(m+1)+"-"+pad(d);
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
const mlen = (y,m) => [31, isLeap(y)?29:28, 31,30,31,30,31,31,30,31,30,31][m];
const ylen = y => isLeap(y) ? 366 : 365;
function ordinal(y,m,d){ let n = d-1; for(let i=0;i<m;i++) n += mlen(y,i); return n; }
/* dilluns = 0 */
function wday(y,m,d){ return (new Date(y,m,d).getDay() + 6) % 7; }

/** Tipus de dia del calendari oficial; si l'any no hi és, patró per defecte. */
function dtype(y,m,d){
  const s = CAL[y];
  if(s && s.length === ylen(y)) return s[ordinal(y,m,d)];
  const w = wday(y,m,d);
  return w >= 5 ? "X" : (w === 4 ? "V" : "P");
}
const theo = (y,m,d) => TYPES[dtype(y,m,d)].h;

/* Cada dia porta la seva marca de temps `t`: és la unitat que es fusiona entre
   dispositius. Esborrar no treu la clau, hi deixa una làpida {del:1} — si no,
   l'altre dispositiu, que encara té la versió antiga, tornaria a ressuscitar el dia. */
const rec = (y,m,d) => { const r = yr(y).days[iso(y,m,d)]; return (r && !r.del) ? r : null; };
function setRec(y,m,d,v){
  const o = yr(y), k = iso(y,m,d);
  if(v === null){ if(o.days[k]) o.days[k] = {del:1, t:Date.now()}; }
  else o.days[k] = Object.assign({}, v, {t:Date.now()});
  save();
}

const fmt  = n => (Math.round(n*100)/100).toLocaleString("ca-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => (Math.round(n*10)/10).toLocaleString("ca-ES",{maximumFractionDigits:1});
/* hores dins la cel·la: 8,25 · 7 · 6,5 — sense zeros de cua */
const fmtH = n => n ? (Math.round(n*100)/100).toLocaleString("ca-ES",{maximumFractionDigits:2}) : "";
/* abril, agost i octubre porten apòstrof: «3 d'agost», no «3 de agost» */
const deMes = m => ("aeiou".includes(MONTHS[m][0].toLowerCase()) ? "d'" : "de ") + MONTHS[m].toLowerCase();
const sgn  = n => (n>=0?"+":"−") + fmt(Math.abs(n));

/** Un dia és dins del contracte? Els de fora no compten per a l'objectiu: si
    entres el 24 d'agost, l'agost no et pot demanar les hores de tot el mes. */
function dinsContracte(y,m,d,P){
  const t = new Date(y,m,d).setHours(0,0,0,0);
  if(P.contracteIni){ const a = new Date(P.contracteIni+"T00:00:00"); if(!isNaN(a) && t < a.setHours(0,0,0,0)) return false; }
  if(P.contracteFi){  const b = new Date(P.contracteFi +"T00:00:00"); if(!isNaN(b) && t > b.setHours(0,0,0,0)) return false; }
  return true;
}

/* ───────────────────────── Agregats ───────────────────────── */
function stats(y){
  const o = yr(y), today = new Date();
  const todayOrd = (today.getFullYear() === y) ? ordinal(y, today.getMonth(), today.getDate()) : (today.getFullYear() > y ? 1e9 : -1);
  const S = {
    months: [], theoTot:0, done:0, vacH:0, ldH:0,
    theoYTD:0, doneYTD:0, vacYTD:0, ldYTD:0,
    days:{HQ:0,EST:0,NAC:0,POS:0,VAC:0,LD:0,DC:0}, worked:0,
    ponts:0, festius:0, capsSetmana:0, festiusTreballats:0,
    extra:0, extraYTD:0, curt:0,
    dest:{}, cfg:o.cfg
  };
  for(let m=0;m<12;m++){
    const M = {theo:0, done:0, vac:0, ld:0, days:0, extra:0, curt:0};
    for(let d=1; d<=mlen(y,m); d++){
      const t = dtype(y,m,d), r = rec(y,m,d);
      /* fora del contracte la jornada no et compta com a objectiu */
      const dins = dinsContracte(y,m,d,o.pay);
      const th = dins ? TYPES[t].h : 0;
      const past = ordinal(y,m,d) <= todayOrd;
      M.theo += th; S.theoTot += th;
      if(dins && t === "B") S.ponts++;
      if(dins && t === "F") S.festius++;
      if(past) S.theoYTD += th;
      if(!r) continue;
      const h = horesDia(r);   /* si hi ha fitxatge, mana el fitxatge */
      M.done += h; S.done += h;
      if(past) S.doneYTD += h;
      /* Les hores extres es compten DIA A DIA i no es compensen entre elles:
         2 h de més un dia i 1 h de menys un altre són 2 h extres, no 1. Per això
         no serveix el saldo (fetes − objectiu), que sí que les compensa. */
      if(!["VAC","LD","DC","POS"].includes(r.s)){   /* aquests dies no es treballen */
        const prev = previstes(y,m,d,r);
        const ex = Math.max(0, r2(h - prev));
        const cu = Math.max(0, r2(prev - h));
        M.extra += ex; S.extra += ex; if(past) S.extraYTD += ex;
        M.curt += cu; S.curt += cu;
      }
      if(r.s){
        S.days[r.s] = (S.days[r.s]||0) + 1;
        if(r.s === "VAC"){ M.vac += th; S.vacH += th; if(past) S.vacYTD += th; }
        if(r.s === "LD" ){ M.ld  += th; S.ldH  += th; if(past) S.ldYTD  += th; }
      }
      /* els dies fora es compten en dies naturals: un diumenge a l'estranger no
         té hores però hi ets igual, així que compta com a dia de desplaçament */
      if(r.d){
        const k = r.d.toUpperCase();
        S.dest[k] = S.dest[k] || {days:0, worked:0, hours:0};
        S.dest[k].days++;
        if(h > 0){ S.dest[k].worked++; S.dest[k].hours += h; }
      }
      if(h > 0){
        M.days++; S.worked++;
        if(t === "X") S.capsSetmana++;
        if(t === "F") S.festiusTreballats++;
      }
    }
    M.target = M.theo - M.vac - M.ld;
    M.saldo  = M.done - M.target;
    S.months.push(M);
  }
  S.autoTarget = S.theoTot - S.vacH - S.ldH;
  S.target     = (o.cfg.target != null && o.cfg.target !== "") ? +o.cfg.target : S.autoTarget;
  S.saldo      = S.done - S.target;
  S.targetYTD  = S.theoYTD - S.vacYTD - S.ldYTD;
  S.saldoYTD   = S.doneYTD - S.targetYTD;
  S.vacLeft    = (+o.cfg.vacH || 0) + (+o.cfg.carry || 0) - S.vacH;
  S.ldLeft     = (+o.cfg.ldH  || 0) - S.ldH;
  return S;
}

/* ───────────────────────── Motor de nòmina ─────────────────────────
   Port del simulador 2026 (⚙️ Config + fulls mensuals). Regla de fons: manen
   les hores que escriu l'usuari. Les hores previstes de cada dia són un camp
   editable; el calendari només hi posa el valor inicial. */
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const r4 = n => Math.round((n + Number.EPSILON) * 10000) / 10000;  /* els tipus van a 4 decimals */
const hm2h = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim()); return m ? (+m[1]) + (+m[2])/60 : null; };

/** Hores fetes d'un dia: de l'inici/fi/pausa si n'hi ha, si no del camp d'hores. */
function horesDia(r){
  if(!r) return 0;
  const a = hm2h(r.i), b = hm2h(r.f);
  if(a != null && b != null){
    let d = b - a; if(d < 0) d += 24;          /* torn que travessa la mitjanit */
    return Math.max(0, r2(d - (+r.p || 0)));
  }
  return +r.h || 0;
}
/** Hores previstes: el que hagi escrit l'usuari; si no, la jornada del calendari. */
const previstes = (y,m,d,r) => (r && r.prev != null && r.prev !== "") ? (+r.prev || 0) : theo(y,m,d);

/** Càlcul d'un dia a partir d'un registre concret: així es pot fer servir tant
    amb el que hi ha desat com amb el que estàs escrivint al formulari. */
function calcDia(y,m,d,r,P){
  if(!r) return null;
  const h = horesDia(r), prev = previstes(y,m,d,r), fest = prev === 0;
  /* vacances, lliure disposició, descans compensat i viatges previstos no es
     treballen: encara que hi quedi un fitxatge, no generen extres ni dieta */
  const noEsTreballa = ["VAC","LD","DC","POS"].includes(r.s);
  const extra = noEsTreballa ? 0 : Math.max(0, r2(h - prev));
  const via = (STATES[r.s]||{}).v || "-";
  const descans = r.c === "D";                       /* extra compensada en descans */
  let dieta = 0;
  if(noEsTreballa) dieta = 0;
  else if(via === "I") dieta = fest ? P.intlFest : P.intlLab;
  else if(via === "N") dieta = P.esmorzar + P.dinar + P.sopar
                             + (fest ? P.capSetmana : P.pernocta) + (+r.km||0) * P.kmEur;
  return {
    d, h, prev, fest, extra, via, descans, dieta: r2(dieta),
    extraPagada: descans ? 0 : extra,
    generat: descans ? r2(extra * (fest ? P.factCdS : P.factLab)) : 0,
    gaudit: r.s === "DC" ? prev : 0,
    /* un dia compta per a la proporció de l'art. 7.p si és festiu/cap de setmana
       o si hi has registrat hores; un laborable buit queda fora */
    computable: fest || h > 0
  };
}
function payDay(y,m,d,P){ return calcDia(y,m,d,rec(y,m,d),P); }

/** Diners que genera un dia. És la part variable —extres pagades i dieta—, que
    és el que fa el full a la columna "Total dia". El salari fix no és diari.
    El net és una estimació: hi apliquem la SS que toca a cada concepte i el
    tipus d'IRPF sobre la part no exempta, sense mirar el topall del mes. */
function eurosDia(y,m,d,r,P,tipus){
  const x = calcDia(y,m,d,r,P);
  if(!x) return null;
  const hOrd = P.horesAny > 0 ? P.salari / P.horesAny : 0;
  const hExtra = hOrd * (1 + P.incrExtra);
  const extraEur = r2(x.extraPagada * hExtra);
  const brut = r2(extraEur + x.dieta);
  const intl = x.via === "I";
  const exempt = !P.art7p ? 0 : r2((P.art7pExtres && intl ? extraEur : 0) + (P.art7pDietes && intl ? x.dieta : 0));
  const subjecte = r2(brut - exempt);
  /* les dietes entren a totes dues bases; les extres, fora de la de contingències
     comunes però amb la seva quota addicional */
  const ssExtres = extraEur * (P.ssAtur + P.ssFP + (P.forcaMajor ? P.ssExtraFM : P.ssExtra));
  const ssDietes = x.dieta * (P.ssCC + P.ssMEI + P.ssAtur + P.ssFP);
  const ss = r2(ssExtres + ssDietes);
  const tp = tipus != null ? tipus : irpfRate(y);
  const irpf = r2(subjecte * tp);
  const net = r2(brut - ss - irpf);
  /* L'art. 7.p no exempta només les extres i la dieta del dia: també la part
     proporcional del SALARI FIX (salari × dies internacionals / dies
     computables). Repartida per dies, a cada dia internacional li toca una
     dotzena part llarga del sou, i l'estalvi d'IRPF que això suposa és més gran
     que tota la resta junta. Sense això, comparar nacional i estranger enganya. */
  const Mm = payMonth(y,m,true);
  const jaHiEs = !!rec(y,m,d);
  const diesComp = Math.max(1, Mm.diesComp + (jaHiEs || !x.computable ? 0 : 1));
  const exSalari = (intl && P.art7p && P.art7pSalari) ? r2(Mm.salari / diesComp) : 0;
  const estalviIRPF = r2(exSalari * tp);
  return {dia:x, extraEur, brut, exempt, subjecte, ss, irpf, net, hExtra,
          exSalari, estalviIRPF, efecte: r2(net + estalviIRPF), diesComp};
}

/** Dies naturals d'un mes dins del període de contracte. Un mes d'alta parcial
    —comences el 24 d'agost— no cobra el mes sencer: es prorrateja per dies. */
function diesAlta(y,m,P){
  const n = mlen(y,m);
  const ini = P.contracteIni ? new Date(P.contracteIni+"T00:00:00") : null;
  const fi  = P.contracteFi  ? new Date(P.contracteFi +"T00:00:00") : null;
  let de = 1, a = n;
  if(ini && !isNaN(ini)){
    if(ini.getFullYear() > y || (ini.getFullYear() === y && ini.getMonth() > m)) return 0;
    if(ini.getFullYear() === y && ini.getMonth() === m) de = ini.getDate();
  }
  if(fi && !isNaN(fi)){
    if(fi.getFullYear() < y || (fi.getFullYear() === y && fi.getMonth() < m)) return 0;
    if(fi.getFullYear() === y && fi.getMonth() === m) a = fi.getDate();
  }
  return Math.max(0, a - de + 1);
}
/** Dies d'alta de tot l'any, per prorratejar les pagues extres. */
function diesAltaAny(y,P){ let t = 0; for(let m=0;m<12;m++) t += diesAlta(y,m,P); return t; }

/** Proporció ANUAL de dies internacionals. Es calcula directament dels registres,
    sense passar per payMonth, perquè la paga extra la necessita i si no faríem
    una crida circular. */
function propAnual(y){
  let comp = 0, intl = 0;
  for(let m=0;m<12;m++) for(let d=1; d<=mlen(y,m); d++){
    const r = rec(y,m,d); if(!r) continue;
    const h = horesDia(r), prev = previstes(y,m,d,r);
    if(!(prev === 0 || h > 0)) continue;
    comp++;
    if(((STATES[r.s]||{}).v || "-") === "I") intl++;
  }
  return comp > 0 ? intl / comp : 0;
}

/** Nòmina d'un mes. Reprodueix el bloc A–E dels fulls mensuals. */
/* `noIrpf` talla la recursió: el tipus de retenció es calcula a partir de les
   retribucions subjectes de tot l'any, que surten d'aquesta mateixa funció. */
function payMonth(y,m,noIrpf){
  const P = yr(y).pay;
  const hOrd = P.horesAny > 0 ? P.salari / P.horesAny : 0;
  const hExtra = hOrd * (1 + P.incrExtra);
  const dies = [];
  for(let d=1; d<=mlen(y,m); d++){ const x = payDay(y,m,d,P); if(x) dies.push(x); }

  const sum = f => dies.reduce((a,x) => a + f(x), 0);
  const M = {dies, hores:r2(sum(x=>x.h)), extraTot:r2(sum(x=>x.extra))};
  /* Prorrateig per dies d'alta: el mes en què entres o surts no es cobra sencer.
     El divisor és 30 per convenció de salari mensual, no els dies reals del mes
     (a Espanya el mes de salari són 30 dies tingui'n 28 o 31). Amb
     diesMesProrrata = 0 es fan servir els dies reals. */
  M.diesMes  = mlen(y,m);
  M.diesAlta = diesAlta(y,m,P);
  M.divisor  = (+P.diesMesProrrata > 0) ? +P.diesMesProrrata : M.diesMes;
  M.factor   = M.divisor > 0 ? Math.min(1, M.diesAlta / M.divisor) : 0;
  M.salari    = r2(P.salari / P.pagues * M.factor);
  M.extraNacH = r2(sum(x => x.via !== "I" ? x.extraPagada : 0));
  M.extraIntH = r2(sum(x => x.via === "I" ? x.extraPagada : 0));
  M.extraNac  = r2(M.extraNacH * hExtra);
  M.extraInt  = r2(M.extraIntH * hExtra);
  M.dietaNac  = r2(sum(x => x.via === "N" ? x.dieta : 0));
  M.dietaInt  = r2(sum(x => x.via === "I" ? x.dieta : 0));
  /* paga extra: amb 14 pagues n'hi ha dues, i la seva part exempta va amb la
     proporció ANUAL de dies internacionals, no la del mes (⚙️ Config B73) */
  M.esExtra   = (P.mesosExtra||[]).includes(m) && M.diesAlta > 0;
  /* la paga extra es merita al llarg de l'any: si no hi has estat d'alta tot
     l'any, en cobres la part proporcional als dies d'alta */
  M.propAlta  = ylen(y) > 0 ? diesAltaAny(y,P) / ylen(y) : 0;
  M.pagaExtra = M.esExtra ? r2(P.salari / P.pagues * M.propAlta) : 0;
  M.brut      = r2(M.salari + M.pagaExtra + M.extraNac + M.extraInt + M.dietaNac + M.dietaInt);

  /* B — exempció art. 7.p */
  M.diesComp = dies.filter(x => x.computable).length;
  M.diesIntl = dies.filter(x => x.computable && x.via === "I").length;
  M.propIntl = M.diesComp > 0 ? M.diesIntl / M.diesComp : 0;
  const on = P.art7p;
  M.exSalari = on && P.art7pSalari ? r2(M.salari * M.propIntl) : 0;
  M.exExtres = on && P.art7pExtres ? M.extraInt : 0;
  M.exDietes = on && P.art7pDietes ? M.dietaInt : 0;
  M.exPaga   = on && P.art7pSalari && M.pagaExtra ? r2(M.pagaExtra * propAnual(y)) : 0;
  M.exempt   = r2(M.exSalari + M.exExtres + M.exDietes + M.exPaga);
  M.subjecte = r2(M.brut - M.exempt);

  /* C — Seguretat Social. Les bases parteixen del salari anual/12, no de la
     paga de 14: és el prorrateig de cotització. Les h.extres queden fora de la
     base de contingències comunes i tenen la seva pròpia quota addicional. */
  /* base i topall també van per dies d'alta */
  const base = P.salari / 12 * M.factor, topall = P.topall * M.factor;
  const extres = M.extraNac + M.extraInt, dietes = M.dietaNac + M.dietaInt;
  M.bcc = Math.min(topall, r2(base + dietes));
  M.bcp = Math.min(topall, r2(base + dietes + extres));
  M.ssCC = -r2(M.bcc * P.ssCC);
  M.ssMEI= -r2(M.bcc * P.ssMEI);
  M.ssAtur = -r2(M.bcp * P.ssAtur);
  M.ssFP = -r2(M.bcp * P.ssFP);
  M.ssExtra = -r2(extres * (P.forcaMajor ? P.ssExtraFM : P.ssExtra));
  M.exces = Math.max(0, r2(base + dietes + extres - topall));
  const t1 = P.solLim1 * topall, t2 = P.solLim2 * topall;
  M.ssSolid = -r2((Math.min(M.exces, t1) * P.solT1
                 + Math.min(Math.max(0, M.exces - t1), t2 - t1) * P.solT2
                 + Math.max(0, M.exces - t2) * P.solT3) * P.solTreb);
  M.ss = r2(M.ssCC + M.ssMEI + M.ssAtur + M.ssFP + M.ssExtra + M.ssSolid);

  /* D — IRPF */
  M.tipus = noIrpf ? 0 : irpfRate(y);
  M.irpf  = -r2(M.subjecte * M.tipus);
  M.net   = r2(M.brut + M.ss + M.irpf);

  /* E — bossa d'hores de descans */
  M.generat = r2(sum(x => x.generat));
  M.gaudit  = r2(sum(x => x.gaudit));
  M.jornades = P.hJornadaDescans > 0 ? r2(M.generat / P.hJornadaDescans) : 0;
  return M;
}

/* ── IRPF: algoritme de retencions de l'AEAT (arts. 80-87 RIRPF) ── */
const ESCALA = [[0,12450,.19],[12450,20200,.24],[20200,35200,.30],[35200,60000,.37],[60000,300000,.45],[300000,1/0,.47]];
const LIMITS = {1:[0,17644,18694], 2:[17197,18130,19262], 3:[15876,16342,16867]};
function quotaEscala(base){
  let q = 0;
  for(const [de,a,t] of ESCALA){ if(base <= de) break; q += (Math.min(base,a) - de) * t; }
  return r2(q);
}
/** Retribucions subjectes previsibles de l'any: el que hi ha registrat, més una
    estimació dels mesos des de l'inici del contracte que encara no tenen dades. */
function previsibles(y){
  const P = yr(y).pay;
  let reg = 0, regSS = 0, estim = 0, mesosReg = 0, mesosEst = 0;
  for(let m=0;m<12;m++){
    const M = payMonth(y,m,true);
    if(M.dies.length){ reg += M.subjecte; regSS += -M.ss; mesosReg++; }
    /* Els mesos del contracte que encara no tens entrats també s'han de
       preveure: si no, el tipus es calcula sobre un any incomplet i surt massa
       baix. Se n'estima només la part fixa —salari i paga extra—, perquè
       hores extres i dietes no es poden endevinar. */
    else if(M.diesAlta > 0){ estim += M.salari + M.pagaExtra; mesosEst++; }
  }
  estim = r2(estim);
  /* SS previsible: la real dels mesos registrats + el tipus pla sobre l'estimació */
  const ss = r2(regSS + estim * (P.ssCC + P.ssAtur + P.ssFP + P.ssMEI));
  return {reg: r2(reg), estim, total: r2(reg + estim), ss, mesosReg, mesosEst};
}
function irpfRate(y){
  const P = yr(y).pay;
  if(String(P.irpfMode).toUpperCase().startsWith("M")) return +P.irpfPct || 0;
  const pv = previsibles(y), prev = pv.total;
  if(prev <= 0) return 0;
  const ss = pv.ss;
  const despeses = 2000 + (P.mobilitat ? 2000 : 0);
  const net = Math.max(0, r2(prev - ss - despeses));
  const red = net <= 14852 ? 7302 : net < 19747.5 ? Math.max(0, r2(7302 - 1.75*(net-14852))) : 0;
  const baseRet = Math.max(0, r2(net - red - (+P.pensioConjuge||0)));
  const minPers = 5550 + (P.edat>=65?1150:0) + (P.edat>=75?1400:0);
  const nd = +P.descend||0;
  const minDesc = ((nd>=1?2400:0)+(nd>=2?2700:0)+(nd>=3?4000:0)+(nd>=4?(nd-3)*4500:0)
                  + (+P.descend3||0)*2800) * (P.descend50 ? .5 : 1);
  const minAsc = (+P.ascend||0)*1150 + (+P.ascend75||0)*1400;
  const minDis = (P.discap>=65?9000:P.discap>=33?3000:0) + ((P.ajudaTercers && P.discap>=33)?3000:0);
  const minim = r2(minPers + minDesc + minAsc + minDis);
  const alim = Math.min(baseRet, +P.aliments||0);
  const minAjust = minim + ((+P.aliments||0) > 0 ? 1980 : 0);
  const quota = Math.max(0, r2(quotaEscala(baseRet - alim) + quotaEscala(alim) - quotaEscala(minAjust)));
  const excl = (LIMITS[P.situacio] || LIMITS[3])[Math.min(nd,2)];
  if(prev <= excl) return 0;
  const limit = Math.max(0, r2(0.43 * (prev - excl)));
  const tipus = r4(Math.min(quota, limit) / prev);
  return Math.max(+P.irpfMin||0, Math.min(0.47, r4(tipus + (+P.irpfAjust||0))));
}

/* ───────────────────────── Render ───────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── Desplegables ──
   Al mòbil el navegador els mostra com una roda; a l'ordinador estalvien haver
   d'escriure l'hora dígit a dígit. */
/* Hores i minuts en desplegables separats: l'hora de 00 a 23 i el minut de 0 a
   59, perquè es pugui fitxar qualsevol moment i no només els quarts. */
function optsUnitat(sel, max){
  let o = `<option value=""${sel===""||sel==null?" selected":""}>—</option>`;
  for(let v=0; v<=max; v++)
    o += `<option value="${pad(v)}"${pad(v)===sel?" selected":""}>${pad(v)}</option>`;
  return o;
}
/** "07:30" → {h:"07", m:"30"}; buit → {h:"", m:""} */
function parteixHora(s){
  const x = /^(\d{1,2}):(\d{1,2})$/.exec(String(s||"").trim());
  return x ? {h:pad(+x[1]), m:pad(+x[2])} : {h:"", m:""};
}
/** Munta "HH:MM"; sense hora no hi ha fitxatge, i el minut buit val 0. */
const muntaHora = (h,m) => h === "" ? "" : pad(+h)+":"+pad(+m||0);
/** Amb minuts lliures el total no cau en trams de 0,25 (07:07→16:43 són 9,10 h),
    i assignar-lo a un <select> que no el té el deixaria buit. L'hi afegim. */
function assegurarOpcio(sel, v){
  if(v === "" || v == null) return;
  const val = String(v);
  if(![...sel.options].some(o => o.value === val)){
    const o = document.createElement("option");
    o.value = val; o.textContent = fmtH(+v) || "0";
    const seg = [...sel.options].find(x => x.value !== "" && +x.value > +v);
    sel.insertBefore(o, seg || null);
  }
  sel.value = val;
}
/* `desDe` evita repetir el zero quan l'opció buida ja vol dir zero */
function optsNum(sel, max, pas=0.25, buit="—", desDe=0){
  const s = (sel === "" || sel == null) ? null : +sel;
  let o = `<option value=""${s===null?" selected":""}>${buit}</option>`;
  for(let v=desDe; v<=max+1e-9; v+=pas){
    const n = Math.round(v*100)/100;
    o += `<option value="${n}"${s!==null && Math.abs(n-s)<1e-9?" selected":""}>${n?fmtH(n):"0"}</option>`;
  }
  return o;
}
/** Fa que tocar el camp obri el calendari, no només la icona. */
function obreCalendari(el){
  if(!el) return;
  const obre = () => { try{ el.showPicker(); }catch(e){} };
  el.addEventListener("click", obre);
  el.addEventListener("focus", obre);
}

function render(){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.v === VIEW));
  const body = VIEW === "cal" ? viewCal() : VIEW === "sum" ? viewSum()
             : VIEW === "trv" ? viewTrv() : viewNom();
  $("view").innerHTML = '<div class="wrap">' + body + '</div>';
  if(VIEW === "cal") wireCal();
  if(VIEW === "sum") wireCharts();
  if(VIEW === "nom") wireNom();
}

function viewCal(){
  const y = YEAR, m = MONTH, S = stats(y), M = S.months[m];
  const first = wday(y,m,1), n = mlen(y,m), today = new Date();
  let cells = "";
  for(let i=0;i<first;i++) cells += '<div class="day pad"></div>';
  for(let d=1; d<=n; d++){
    const t = dtype(y,m,d), r = rec(y,m,d);
    const cls = ["day","act"];
    if(r && r.s) cls.push("s-"+r.s); else if(t==="X"||t==="F"||t==="B") cls.push("t-"+t);
    if(today.getFullYear()===y && today.getMonth()===m && today.getDate()===d) cls.push("today");
    const hh = horesDia(r);
    const h = hh ? fmtH(hh)+"h" : fmtH(TYPES[t].h);
    const tag = r && r.d ? esc(r.d) : (r && r.s ? r.s.slice(0,3) : "");
    cells += `<div class="${cls.join(" ")}" data-d="${d}">`
           + (tag ? `<span class="tag">${tag}</span>` : "")
           + `<span class="n">${d}</span><span class="h">${h}</span></div>`;
  }
  const leg = [["t-X","No laborable"],["t-F","Festiu"],["t-B","Pont"],["s-HQ","HQ"],
               ["s-EST","Estranger"],["s-NAC","Nacional"],["s-VAC","Vacances"],["s-LD","Lliure disp."]]
    .map(([c,l]) => `<span><i class="sw ${c}"></i>${l}</span>`).join("");

  <div class="mnav">
    <button id="mPrev">‹</button>
    <div class="mtitle">${MONTHS[m].toUpperCase()} ${y}</div>
    <button id="mNext">›</button>

  <div class="chips" style="margin-bottom:10px">
    <span class="chip">objectiu <b>${fmt(M.target)}</b> h</span>
    <span class="chip">fetes <b>${fmt(M.done)}</b> h</span>
    <span class="chip ${M.saldo>=0?"pos":"neg"}">saldo <b>${sgn(M.saldo)}</b> h</span>
    <span class="chip">dies <b>${M.days}</b></span>
  </div>
  <div class="calwrap">
    <div class="wk">${WDAYS.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="grid" id="grid">${cells}</div>
  </div>
  <div class="leg">${leg}</div>
  <div class="note">Toca un dia per marcar-lo. Des de l'editor pots aplicar el mateix estat a un rang de dates.</div>`;
}

function viewTrv(){
  const y = YEAR, S = stats(y);
  const ks = Object.keys(S.dest).sort((a,b) => S.dest[b].days - S.dest[a].days);
  const rows = ks.length ? ks.map(k => `<tr><td>${esc(k)}</td><td>${S.dest[k].days}</td><td class="dim">${S.dest[k].worked}</td><td>${fmt(S.dest[k].hours)}</td></tr>`).join("")
                         : `<tr><td colspan="4" class="dim" style="text-align:left">Cap destinació registrada encara.</td></tr>`;
  /* estades = trams consecutius amb la mateixa destinació */
  const trips = [];
  let cur = null;
  for(let m=0;m<12;m++) for(let d=1; d<=mlen(y,m); d++){
    const r = rec(y,m,d), k = r && r.d ? r.d.toUpperCase() : null;
    if(k && cur && cur.k === k && cur.gap < 4){ cur.to = [m,d]; cur.days++; cur.gap = 0; }
    else if(k){ if(cur) trips.push(cur); cur = {k, from:[m,d], to:[m,d], days:1, gap:0}; }
    else if(cur) cur.gap++;
  }
  if(cur) trips.push(cur);
  const dstr = ([m,d]) => d+" "+MSHORT[m].toLowerCase();
  const trows = trips.length ? trips.reverse().map(t =>
      `<tr><td>${esc(t.k)}</td><td style="text-align:left" class="dim">${dstr(t.from)} → ${dstr(t.to)}</td><td>${t.days}</td></tr>`).join("")
    : `<tr><td colspan="3" class="dim" style="text-align:left">—</td></tr>`;
  return `
  <div class="card">
    <div class="card-t">Dies per destinació — ${y}</div>
    <table><thead><tr><th>Destinació</th><th>Dies fora</th><th>Treballats</th><th>Hores</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">La destinació és el codi que escrius a l'editor del dia (p. ex. <b>CA</b>, <b>PL</b>, <b>FR</b>). <b>Dies fora</b> són dies naturals: hi entren caps de setmana i festius. <b>Treballats</b> són els que tenen hores.</div>
  </div>
  <div class="card">
    <div class="card-t">Estades</div>
    <table><thead><tr><th>Destinació</th><th style="text-align:left">Període</th><th>Dies</th></tr></thead><tbody>${trows}</tbody></table>
    <div class="note">Els dies solts amb la mateixa destinació separats per menys de 4 dies es compten com una sola estada.</div>
  </div>`;
}

/** Totals de l'any i bossa d'hores amb imputació FIFO i caducitat. */
function payYear(y){
  const P = yr(y).pay, ms = [];
  for(let m=0;m<12;m++) ms.push(payMonth(y,m));
  const A = {brut:0, exempt:0, subjecte:0, ss:0, irpf:0, net:0,
             saldo:Array(12).fill(0), caducat:Array(12).fill(0), mesos:ms};
  /* només compten els mesos amb dies registrats: si no, cada mes buit hi sumaria
     igualment el salari fix i el total anual sortiria inflat */
  ms.forEach(M => { if(!M.dies.length) return;
                    A.brut+=M.brut; A.exempt+=M.exempt; A.subjecte+=M.subjecte;
                    A.ss+=M.ss; A.irpf+=M.irpf; A.net+=M.net; });
  A.mesosAmbDades = ms.filter(M => M.dies.length).length;
  ["brut","exempt","subjecte","ss","irpf","net"].forEach(k => A[k] = r2(A[k]));
  /* FIFO: cada mes gasta primer les hores més antigues encara vives */
  const lots = [];                        /* {mes, h} pendents */
  for(let m=0;m<12;m++){
    let cal = ms[m].gaudit;
    for(const L of lots){ if(cal <= 0) break; const u = Math.min(L.h, cal); L.h -= u; cal -= u; }
    let cad = 0;
    for(const L of lots) if(m - L.mes >= P.mesosCaducitat && L.h > 0){ cad += L.h; L.h = 0; }
    A.caducat[m] = r2(cad);
    if(ms[m].generat > 0) lots.push({mes:m, h:ms[m].generat});
    A.saldo[m] = r2(lots.reduce((a,L) => a + L.h, 0));
  }
  return A;
}

/* ───────────────────────── Gràfics ───────────────────────── */
const CH = {w:720, h:230, l:38, r:12, t:14, b:26};
function niceMax(v){
  if(v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (p/2)) * (p/2);
}
function barChart(S){
  const {w,h,l,r,t,b} = CH, iw = w-l-r, ih = h-t-b;
  const max = niceMax(Math.max(10, ...S.months.map(M => Math.max(M.done, M.target))));
  const band = iw/12, bw = Math.min(24, band-12);
  const yv = v => t + ih - (v/max)*ih;
  let g = "", marks = "";
  for(let i=0;i<=4;i++){
    const v = max*i/4, py = yv(v);
    g += `<line x1="${l}" y1="${py}" x2="${w-r}" y2="${py}" stroke="var(--br)" stroke-width="1"/>`
       + `<text x="${l-6}" y="${py+3.5}" text-anchor="end" font-size="11.5" fill="var(--tx3)">${fmt0(v)}</text>`;
  }
  S.months.forEach((M,i) => {
    const cx = l + band*i + band/2, bh = Math.max(0, ih - (yv(M.done)-t));
    if(M.done > 0)
      marks += `<rect x="${cx-bw/2}" y="${yv(M.done)}" width="${bw}" height="${bh}" rx="4" ry="4" fill="var(--c-bar)"/>`
             + `<rect x="${cx-bw/2}" y="${Math.max(yv(M.done), t+ih-4)}" width="${bw}" height="${Math.min(4,bh)}" fill="var(--c-bar)"/>`;
    if(M.target > 0)
      marks += `<line x1="${cx-bw/2-4}" y1="${yv(M.target)}" x2="${cx+bw/2+4}" y2="${yv(M.target)}" stroke="var(--tx3)" stroke-width="2" stroke-linecap="round"/>`;
    marks += `<rect class="hit" x="${l+band*i}" y="${t}" width="${band}" height="${ih}" fill="transparent"
       data-tip="${MSHORT[i]}\nfetes ${fmt(M.done)} h\nobjectiu ${fmt(M.target)} h\nsaldo ${sgn(M.saldo)} h"/>`;
    marks += `<text x="${cx}" y="${h-8}" text-anchor="middle" font-size="11.5" fill="var(--tx3)">${MSHORT[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Hores fetes per mes amb l'objectiu de cada mes">${g}
    <line x1="${l}" y1="${t+ih}" x2="${w-r}" y2="${t+ih}" stroke="var(--br2)" stroke-width="1"/>${marks}</svg>`;
}
function lineChart(S){
  const {w,l,r,t,b} = CH, h = 190, ih = h-t-b, iw = w-l-r;
  let acc = 0; const pts = [];
  S.months.forEach((M,i) => { acc += M.saldo; pts.push({i, v:acc, m:M}); });
  /* l'escala envolta les dades i el zero, sense reservar un rang simètric buit */
  const vals = pts.map(p => p.v).concat([0]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const step = niceMax(Math.max(hi - lo, 10)) / 4;
  const min = Math.floor(lo/step) * step, max = Math.max(Math.ceil(hi/step) * step, min + step*4);
  const yv = v => t + ih - ((v-min)/(max-min))*ih;
  const xv = i => l + (iw/12)*i + (iw/12)/2;
  let g = "";
  for(let i=0;i<=4;i++){
    const v = min + (max-min)*i/4, py = yv(v);
    g += `<line x1="${l}" y1="${py}" x2="${w-r}" y2="${py}" stroke="var(--br)" stroke-width="1"/>`
       + `<text x="${l-6}" y="${py+3.5}" text-anchor="end" font-size="11.5" fill="var(--tx3)">${fmt0(v)}</text>`;
  }
  g += `<line x1="${l}" y1="${yv(0)}" x2="${w-r}" y2="${yv(0)}" stroke="var(--br2)" stroke-width="1"/>`;
  const live = pts.filter(p => p.m.done > 0 || p.m.vac > 0 || p.m.ld > 0);
  let path = "", marks = "";
  live.forEach((p,k) => { path += (k?" L ":"M ") + xv(p.i) + " " + yv(p.v); });
  if(live.length){
    marks += `<path d="${path}" fill="none" stroke="var(--c-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = live[live.length-1];
    /* l'etiqueta va sempre cap a dins del marc, no cap a la vora que té a prop */
    const ly = yv(last.v), off = ly > t + ih/2 ? -12 : 18;
    marks += `<circle cx="${xv(last.i)}" cy="${ly}" r="4.5" fill="var(--c-line)" stroke="var(--c-surface)" stroke-width="2"/>`
           + `<text x="${xv(last.i)}" y="${ly + off}" text-anchor="${last.i>9?"end":"middle"}" font-size="12.5" font-weight="700" fill="var(--tx1)">${sgn(last.v)} h</text>`;
    live.forEach(p => { marks += `<rect class="hit" x="${xv(p.i)-iw/24}" y="${t}" width="${iw/12}" height="${ih}" fill="transparent" data-tip="${MSHORT[p.i]}\nacumulat ${sgn(p.v)} h\nmes ${sgn(p.m.saldo)} h"/>`; });
  }
  S.months.forEach((M,i) => { marks += `<text x="${xv(i)}" y="${h-8}" text-anchor="middle" font-size="11.5" fill="var(--tx3)">${MSHORT[i]}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Saldo d'hores acumulat mes a mes">${g}${marks}</svg>`;
}
function wireCharts(){
  const tip = $("tip");
  $("view").querySelectorAll(".hit").forEach(el => {
    const show = e => {
      tip.textContent = el.dataset.tip;
      tip.style.display = "block";
      const p = e.touches ? e.touches[0] : e;
      const bx = Math.min(p.clientX + 12, innerWidth - tip.offsetWidth - 8);
      tip.style.left = Math.max(8, bx) + "px";
      tip.style.top  = Math.max(8, p.clientY - tip.offsetHeight - 12) + "px";
    };
    el.addEventListener("mousemove", show);
    el.addEventListener("touchstart", show, {passive:true});
    el.addEventListener("mouseleave", () => tip.style.display = "none");
    el.addEventListener("touchend", () => setTimeout(() => tip.style.display = "none", 1600));
  });
}

      if(["VAC","LD","POS"].includes(b.dataset.s)){ hIn.value = ""; autoH = false; }
      else if(!hIn.value || autoH) setAuto(th || 8);
    }
    pintaCalc();
  });
  const step = k => { const v = Math.max(0, r2((+hIn.value||0) + k)); if(v) assegurarOpcio(hIn, v); else hIn.value = ""; autoH = false; };
  $("hMinus").onclick = () => step(-0.25);
  $("hPlus").onclick  = () => step(0.25);
  $("hTheo").onclick  = () => setAuto(th || 8);
  $("cmp").querySelectorAll(".stb").forEach(b => b.onclick = () => {

  /* el fitxatge mana sobre el camp d'hores: si hi ha inici i fi, el total surt d'aquí */
  const llegeixFitxatge = () => ({

    f: muntaHora($("fH").value, $("fM").value),

  });

    const nota = $("hCalc");
    if(F.i && F.f){
      const v = horesDia(F);
      assegurarOpcio(hIn, v); autoH = false;
      nota.textContent = `Del fitxatge: ${fmt(v)} h`;
    } else nota.textContent = "";
  };
  /* El tipus d'IRPF recorre tot l'any: el calculem un cop en obrir la fitxa. */
  const tipusIRPF = irpfRate(y);
  const P = yr(y).pay;
  /** Estat actual del formulari, com si fos un registre desat. */
  const registreForm = () => {
    const F = llegeixFitxatge();
    const v = {i:F.i, f:F.f, p:F.p, h:+hIn.value || 0, km:+$("kmIn").value || 0,
               d:$("dIn").value.trim().toUpperCase(),
               s:($("stb").querySelector(".stb.on")||{dataset:{}}).dataset.s || "",
               c:($("cmp").querySelector(".stb.on")||{dataset:{}}).dataset.c || "P"};
    if($("prevIn").value !== "") v.prev = +$("prevIn").value;
    return v;
  };
  const pintaCalc = () => {
    const E = eurosDia(y,m,d,registreForm(),P,tipusIRPF);
    const S = stats(y);
    const box = $("diaCalc");
    if(!E){ box.innerHTML = ""; return; }
    const x = E.dia;
    /* l'acumulat de stats() surt del que hi ha DESAT: hi canviem el que aquest
       dia hi aportava per el que hi aportaria amb el que tens escrit ara */
    const desat = calcDia(y,m,d,rec(y,m,d),P);
    const compta = q => q && !["VAC","LD","DC","POS"].includes((registreForm().s)||"") ? q.extra : 0;
    const acumulat = Math.max(0, r2(S.extra - (desat ? desat.extra : 0) + compta(x)));
    const fila = (l,v,cls) => `<div style="display:flex;justify-content:space-between;gap:10px">
      <span class="note" style="margin:0">${l}</span><b class="${cls||""}" style="font-family:monospace">${v}</b></div>`;
    box.innerHTML =
      fila("Hores extres del dia", fmt(x.extra) + " h", x.extra ? "pos" : "dim")
    + fila("Acumulades l'any, amb aquesta", fmt(acumulat) + " h", "dim")
    + `<div style="height:6px"></div>`
    + fila("Brut del dia", eur(E.brut) + " €")
    + (E.exempt ? fila("exempt art. 7.p", eur(E.exempt) + " €", "dim") : "")
    + fila("− SS i IRPF", eur(E.ss + E.irpf) + " €", "neg")
    + fila("Net del dia", eur(E.net) + " €", "pos")
    + (E.exSalari ? `<div style="height:6px"></div>`
        + fila("Salari fix que aquest dia deixa exempt", eur(E.exSalari) + " €", "dim")
        + fila("Estalvi d'IRPF que suposa", eur(E.estalviIRPF) + " €", "pos")
        + fila("Efecte total del dia", eur(E.efecte) + " €", "pos") : "")
    + `<div class="note" style="margin-top:6px">${
        x.descans ? "Les extres van a la bossa de descans, així que no es paguen."
        : x.extra ? "Extres a " + eur(E.hExtra) + " €/h" : ""}${
        x.dieta ? (x.extra && !x.descans ? " · " : "")
                + "<b>dieta " + (x.via === "I" ? "internacional" : "nacional") + "</b> "
                + eur(x.dieta) + " €" + (x.via === "I" ? ", exempta d'IRPF per l'art. 7.p" : ", tributa")
                : ""}${
        !x.extra && !x.dieta ? "Sense extres ni dieta: aquest dia no genera part variable." : ""}
      ${x.via !== "-" ? `<br>El règim de dieta el marca l'<b>estat del dia</b> (${STATES[registreForm().s].l}), no el codi de destinació.` : ""}</div>`;
  };
  ["iH","iM","fH","fM","pIn"].forEach(id =>
    ["input","change"].forEach(ev => $(id).addEventListener(ev, syncH)));
  /* qualsevol camp que canviï els diners repinta el resum; els botons d'estat i
     de compensació el criden ells mateixos, just després de moure la classe */
  $("sheet").addEventListener("change", pintaCalc);
  $("sheet").addEventListener("input", pintaCalc);
  obreCalendari($("untilIn"));
  syncH();
  pintaCalc();
  $("shDel").onclick  = () => { applyRange(null); };
  $("shOk").onclick   = () => {
    const s = ($("stb").querySelector(".stb.on")||{dataset:{}}).dataset.s || "";
    const h = +hIn.value || 0, dd = $("dIn").value.trim().toUpperCase(), n = $("nIn").value.trim();
    const F = llegeixFitxatge();
    const extra = {
      i: F.i, f: F.f, p: F.p,
      prev: $("prevIn").value === "" ? null : +$("prevIn").value,
      km: +$("kmIn").value || 0,
      c: ($("cmp").querySelector(".stb.on")||{dataset:{}}).dataset.c || "P"
    };
    if(!s && !h && !dd && !n && !extra.i && !extra.km && extra.prev === null) return applyRange(null);
    applyRange({s, h, d:dd, n, auto: autoH && h > 0, extra});
  };
}
function applyRange(val){
  const {y,m,d} = SEL, until = $("untilIn").value;
  let last = {m,d};
  if(until){
    const p = until.split("-").map(Number);
    if(p[0] === y) last = {m:p[1]-1, d:p[2]};
  }
  const from = ordinal(y,m,d), to = ordinal(y,last.m,last.d);
  for(let mm=0; mm<12; mm++) for(let dd=1; dd<=mlen(y,mm); dd++){
    const o = ordinal(y,mm,dd);
    if(o < from || o > to) continue;
    if(val === null){ setRec(y,mm,dd,null); continue; }
    const t = dtype(y,mm,dd);
    /* Un desplaçament es compta en dies naturals: si ets fora, hi ets també el
       cap de setmana i els festius. La resta d'estats (HQ, vacances, lliure
       disposició) només toquen dies amb jornada; per registrar un cap de setmana
       treballat a la seu, obre aquell dia tot sol. El dia tocat sempre s'escriu. */
    const away = ["EST","NAC","POS"].includes(val.s);
    if(o !== from && TYPES[t].h === 0 && !away) continue;
    /* amb hores automàtiques cada dia agafa la seva pròpia jornada (intensiva,
       divendres…); els dies sense jornada queden marcats però a zero hores —
       hi ets, però no hi treballes tret que ho posis tu */
    const h = o === from ? val.h
            : TYPES[t].h === 0 ? 0
            : val.auto ? TYPES[t].h : val.h;
    const v = {};
    if(val.s) v.s = val.s;
    if(h) v.h = h;
    if(val.d) v.d = val.d;
    if(val.n && o === from) v.n = val.n;
    const E = val.extra;
    if(E){
      /* el fitxatge concret és del dia que has obert; en la resta del rang només
         s'hi repeteix si aquell dia té jornada, i les hores previstes són les seves */
      if(o === from){ if(E.i) v.i = E.i; if(E.f) v.f = E.f; if(E.p) v.p = E.p;
                      if(E.prev !== null) v.prev = E.prev; }
      else if(E.i && TYPES[t].h > 0){ v.i = E.i; if(E.f) v.f = E.f; if(E.p) v.p = E.p; }
      if(E.km) v.km = E.km;
      if(E.c === "D") v.c = "D";
    }
    setRec(y,mm,dd, Object.keys(v).length ? v : null);
  }
  closeSheet(); render();
}

/* ───────────────────────── Google Drive ─────────────────────────
   Es fusiona dia a dia, no fitxer sencer: pots editar l'agost al mòbil i el
   setembre a l'ordinador i no es trepitgen. Per a cada data guanya la versió
   amb la marca de temps més alta. */
function mergeDB(a, b){
  const out = {v:1, years:{}};
  const years = new Set([...Object.keys(a.years||{}), ...Object.keys(b.years||{})]);
  years.forEach(y => {
    const ay = (a.years||{})[y] || {}, by = (b.years||{})[y] || {};
    const days = {}, keys = [...new Set([...Object.keys(ay.days||{}), ...Object.keys(by.days||{})])].sort();
    keys.forEach(k => {
      const ar = (ay.days||{})[k], br = (by.days||{})[k];
      if(!ar || !br){ days[k] = ar || br; return; }
      /* amb la mateixa marca de temps desempatem pel contingut, perquè els dos
         dispositius arribin al mateix resultat i no s'estiguin trepitjant */
      days[k] = (ar.t||0) !== (br.t||0) ? ((ar.t||0) > (br.t||0) ? ar : br)
              : (JSON.stringify(ar) <= JSON.stringify(br) ? ar : br);
    });
    const newerA = (ay.cfgT||0) >= (by.cfgT||0);
    out.years[y] = {days, cfgT: Math.max(ay.cfgT||0, by.cfgT||0),
                    cfg: Object.assign(DEFCFG(), (newerA ? ay.cfg : by.cfg) || ay.cfg || by.cfg || {})};
  });
  return out;
}
function pruned(db){
  const cut = Date.now() - TOMB_DAYS*864e5, out = {v:1, years:{}};
  Object.entries(db.years||{}).forEach(([y,o]) => {
    const days = {};
    Object.entries(o.days||{}).forEach(([k,r]) => { if(!(r.del && (r.t||0) < cut)) days[k] = r; });
    out.years[y] = Object.assign({}, o, {days});
  });
  return out;
}

function loadGIS(){

/** Google només accepta orígens https autoritzats. Obrint el fitxer del disc
    (file://) o des de localhost, l'autenticació no pot arrencar: val més dir-ho
    que deixar l'usuari amb un «accés cancel·lat» que no explica res. */
function origenValid(){
  return location.protocol === "https:" && !/^(localhost|127\.|\[::1\])/.test(location.hostname);
}
const URL_PUBLICADA = "https://txals13.github.io/Calendari-laboral/";
const SCOPE_DRIVE = "https://www.googleapis.com/auth/drive.file";
let tokenClient = null, pendingAuth = null;

/** El client es construeix UN cop, a l'arrencada. requestAccessToken obre una
    finestra emergent, i els navegadors només la permeten dins del gest de
    l'usuari: si abans hi fem un `await` que va a la xarxa (baixar l'script de
    Google), quan tornem el gest ja s'ha perdut i la finestra queda bloquejada
    en silenci. A l'escriptori passa sempre el primer cop; al mòbil no, perquè
    el flux s'obre en pestanya. */
async function initGIS(){
  if(tokenClient) return true;
  if(!origenValid()) return false;
  if(!await loadGIS() || !window.google || !window.google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE_DRIVE,
    callback: r => {
      const done = pendingAuth; pendingAuth = null; if(!done) return;
      if(r.error){ done(null); return; }
      token = r.access_token; tokenExp = Date.now() + (((r.expires_in||3600)-120)*1000);
      saveTok(); done(token);
    },
    /* GIS ens diu si la finestra no s'ha pogut obrir o si l'has tancada */
    error_callback: e => {
      const done = pendingAuth; pendingAuth = null; if(done) done({err:(e && e.type) || "unknown"});
    }
  });
  return true;
}
async function googleLogin(){
  if(!origenValid()){
    syncErr = location.protocol === "file:"
      ? "Has obert el fitxer del disc. Google no hi pot autenticar: obre l'app des de " + URL_PUBLICADA
      : "Aquest origen (" + location.origin + ") no està autoritzat a Google. Obre l'app des de " + URL_PUBLICADA;
    return null;
  }
  if(!await initGIS()){
    syncErr = "No s'ha pogut carregar Google Sign-In. Comprova la connexió."; return null;
  }
  /* xarxa de seguretat per si no arriba ni el callback ni l'error_callback */
  const opened = new Promise(res => { pendingAuth = res; tokenClient.requestAccessToken({prompt:"consent"}); });
  const out = await Promise.race([opened, new Promise(res => setTimeout(() => res("timeout"), 60000))]);
  if(out === "timeout"){ pendingAuth = null; syncErr = "Google no ha respost. Torna-ho a provar."; return null; }
  if(out && out.err){
    syncErr = out.err === "popup_failed_to_open"
      ? "El navegador ha bloquejat la finestra de Google. Permet les finestres emergents per a aquest lloc i torna-ho a provar."
      : out.err === "popup_closed"
      ? "Has tancat la finestra de Google abans d'acabar."
      : "L'accés no s'ha pogut completar (" + out.err + ").";
    return null;
  }
  if(!out) syncErr = "Accés cancel·lat.";
  return out;
}
async function ensureToken(interactive){
  if(token && Date.now() < tokenExp) return token;
  /* «cal reautoritzar» només té sentit si abans hi havia sessió; si no n'hi ha
     hagut mai, l'estat correcte és simplement «no connectat» */
  if(!interactive){ if(signedIn) needsAuth = true; token = null; tokenExp = 0; return null; }
  const t = await googleLogin();
  if(t) needsAuth = false;
  return t;
}
/* Un 401 s'ha de propagar, no confondre's amb «no hi ha res»: si no, una sessió
   caducada semblaria un Drive buit i acabaríem creant un fitxer duplicat. */
function authFail(){ token = null; tokenExp = 0; needsAuth = true; const e = new Error("auth"); e.auth = 1; return e; }
async function dget(url){
  const r = await fetch(url, {headers:{Authorization:"Bearer "+token}});
  if(r.status === 401 || r.status === 403) throw authFail();
  return r;
}
async function getRootId(){
  if(rootId) return rootId;
  const MIME = "application/vnd.google-apps.folder";
  const q = "name="+JSON.stringify(ROOT_NAME)+" and trashed=false and mimeType="+JSON.stringify(MIME);
  const r = await dget("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&fields=files(id)");
  if(r.ok){ const d = await r.json(); if(d.files && d.files.length) rootId = d.files[0].id; }
  if(!rootId){
    const c = await fetch("https://www.googleapis.com/drive/v3/files", {method:"POST",
      headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
      body: JSON.stringify({name:ROOT_NAME, mimeType:MIME})});
    if(c.status === 401 || c.status === 403) throw authFail();
    if(c.ok) rootId = (await c.json()).id;
  }
  if(rootId) try{ localStorage.setItem(KROOT, rootId); }catch(e){}
  return rootId;
}
async function findDataFile(){
  const q = "name="+JSON.stringify(DATA_FILE)+" and trashed=false";
  const r = await dget("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&fields=files(id)");
  if(r.ok){ const d = await r.json(); if(d.files && d.files.length) return d.files[0].id; }
  return null;
}
/** Baixa, fusiona amb el que hi ha aquí i torna a pujar si el local aportava res. */
async function sync(interactive){
  if(syncing) return;
  syncing = true; syncErr = ""; setSyncUI();
  try{
    if(!await ensureToken(interactive)){ if(!needsAuth) signedIn = false; setSyncUI(); return; }
    signedIn = true; needsAuth = false;
    if(!fileId) fileId = await findDataFile();
    let remote = null;
    if(fileId){
      const r = await dget("https://www.googleapis.com/drive/v3/files/"+fileId+"?alt=media");
      if(r.ok) remote = await r.json();
      else if(r.status === 404) fileId = null;
      else { syncErr = "Error llegint de Drive ("+r.status+")."; setSyncUI(); return; }
    }
    if(remote && remote.years) DB = mergeDB(DB, remote);
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
    await push();
    lastSync = Date.now();
    render();
  }catch(e){
    syncErr = e.auth ? "Cal tornar a autoritzar l'accés a Drive."
                     : "Sense connexió — les dades queden desades aquí.";
  }
  finally{ syncing = false; saveTok(); setSyncUI(); }
}
async function push(){
  const body = JSON.stringify(pruned(DB));
  let r;
  if(fileId){
    r = await fetch("https://www.googleapis.com/upload/drive/v3/files/"+fileId+"?uploadType=media",
      {method:"PATCH", headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}, body});
    if(r.status === 401 || r.status === 403) throw authFail();
    if(r.status === 404) fileId = null;
  }
  if(!fileId){
    const parent = await getRootId();
    const meta = JSON.stringify({name:DATA_FILE, mimeType:"application/json", parents: parent?[parent]:[]});
    const bnd = "cal_"+Date.now();
    const mp = "--"+bnd+"\r\nContent-Type: application/json\r\n\r\n"+meta
             + "\r\n--"+bnd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bnd+"--";
    r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:"POST", headers:{Authorization:"Bearer "+token,"Content-Type":"multipart/related; boundary="+bnd}, body:mp});
    if(r.status === 401 || r.status === 403) throw authFail();
    if(r.ok) fileId = (await r.json()).id;
  }
  if(!r || !r.ok) syncErr = "No s'ha pogut desar a Drive.";
  saveTok();
}
/* Un rang pot escriure trenta dies seguits: agrupem-ho en una sola pujada. */
function schedulePush(){
  if(!signedIn) return;
  pushPending = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    if(syncing || !pushPending) return;
    pushPending = false; syncing = true; setSyncUI();
    try{
      /* si el testimoni ha caducat, ensureToken marca needsAuth i els canvis
         es queden aquí fins que autoritzis: no es perd res */
      if(await ensureToken(false)){ await push(); lastSync = Date.now(); }
    }catch(e){
      syncErr = e.auth ? "Cal tornar a autoritzar l'accés a Drive."
                       : "Sense connexió — les dades queden desades aquí.";
    }
    finally{ syncing = false; setSyncUI(); }
  }, 2000);
}
function setSyncUI(){
  const b = $("btnSync"); if(!b) return;
  /* needsAuth va abans que l'error: és l'estat accionable, i el símbol ha de dir
     «toca aquí» en comptes de només «alguna cosa ha anat malament» */
  const st = syncing   ? ["◍","var(--gold)","Sincronitzant…"]
           : needsAuth ? ["◐","var(--gold)","Cal tornar a autoritzar l'accés a Drive — toca aquí"]
           : syncErr   ? ["●","var(--red)", syncErr]
           : signedIn  ? ["●","var(--green)","Drive · "+(lastSync?new Date(lastSync).toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"}):"connectat")]
           : !origenValid() ? ["⊘","var(--tx3)","Aquí no es pot connectar amb Drive: obre l'app des de "+URL_PUBLICADA]
           : ["○","var(--tx3)","Només en aquest dispositiu — toca per connectar amb Drive"];
  b.textContent = st[0]; b.style.color = st[1]; b.title = st[2];
}

/* ───────────────────────── Arrencada ───────────────────────── */
function syncYearSel(){
  const sel = $("yearSel"), ys = new Set([2026, YEAR, new Date().getFullYear()]);
  Object.keys(DB.years).forEach(y => ys.add(+y));
  const list = [...ys].sort();
  list.unshift(list[0]-1); list.push(list[list.length-1]+1);
  sel.innerHTML = [...new Set(list)].map(y => `<option value="${y}"${y===YEAR?" selected":""}>${y}</option>`).join("");
}
function setTheme(light){
  document.documentElement.classList.toggle("light", light);
  $("btnTheme").textContent = light ? "☀️" : "🌙";
  document.querySelector('meta[name=theme-color]').content = light ? "#ffffff" : "#111827";
  try{ localStorage.setItem(KTHM, light ? "l" : "d"); }catch(e){}
}
function init(){
  load();
  const now = new Date();
  YEAR = CAL[now.getFullYear()] ? now.getFullYear() : 2026;
  MONTH = (now.getFullYear() === YEAR) ? now.getMonth() : 0;
  setTheme((()=>{ try{ return localStorage.getItem(KTHM) === "l"; }catch(e){ return false; } })());
  syncYearSel();
  $("yearSel").onchange = e => { YEAR = +e.target.value; render(); };
  $("btnTheme").onclick = () => { setTheme(!document.documentElement.classList.contains("light")); render(); };
  $("btnCfg").onclick   = openCfg;
  $("btnSync").onclick  = () => sync(true);
  $("scrim").onclick    = closeSheet;
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { VIEW = t.dataset.v; render(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
  render();

  /* Carreguem Google d'entrada perquè, quan cliquis, requestAccessToken es cridi
     dins del mateix gest i el navegador no bloquegi la finestra. */
  initGIS();
  /* Service worker: fa que l'app obri sense connexió. Ha de ser un fitxer de
     debò servit per http(s); des d'un blob: el navegador el rebutja. */
  if("serviceWorker" in navigator){
    /* updateViaCache:"none" evita que el propi sw.js se serveixi de la memòria
       cau HTTP; update() força a buscar-ne una versió nova en cada obertura. */
    addEventListener("load", () => navigator.serviceWorker
      .register("./sw.js", {scope:"./", updateViaCache:"none"})
      .then(reg => reg.update().catch(() => {}))
      .catch(() => {}));
  }
  /* si ja hi havia sessió, baixem el que s'hagi fet en un altre dispositiu */
  const had = loadTok();
  signedIn = had; needsAuth = had && Date.now() >= tokenExp;
  setSyncUI();
  if(had) sync(false);
  /* i tornem a mirar en tornar a l'app o cada 5 min amb la pestanya oberta */
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && signedIn && Date.now() - lastSync > 60000) sync(false);
  });
  setInterval(() => { if(signedIn && !syncing && !pushPending) sync(false); }, 300000);
}
init();
</script>
